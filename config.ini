[general]
enabled = true
; true | false
; false disables the controller without removing it.

require_offline_launch = true
; true | false
; true runs only in an offline launch (EOS_USE_ANTICHEATCLIENTNULL=1 or
; -eac-nop-loaded). Keep it true.

[control]
mode = toggle
; percent | toggle
; percent: one signed scale. +100% full throttle, 0% neutral, -100% full brake.
; The setting is kept when the keys are released. Uses the percent keys below.
; toggle: each direction is a toggle or a vanilla hold. Uses the toggle keys below.

; ---- Common to both modes ----

neutral_key = None
; Unreal key name (X, F10, ...) | None
; Optional separate key that selects neutral (0%). None disables it.

airbrake_key = None
; Unreal key name (B, ...) | None
; Optional air brake: full brake while active, in every mode. The stored
; throttle setting is kept and resumes afterwards. Choose a key the game does
; not use. None disables it.

airbrake_mode = toggle
; hold | toggle
; hold: full brake while the key is held. toggle: each press turns it on or off.

; ---- percent mode ----

sensitivity = 150
; 1 to 200
; Command change in percentage points per second while a key is held.
; 50 takes 1 s from 0% to +50% and 2 s from neutral to full.

brake_floor = -10
; -100 to 0
; Lowest stored percentage. Holding decelerate at the floor is the game's full
; brake while held; releasing returns to the floor. -100 gives progressive
; braking down to full brake; 0 gives throttle only with full brake while
; decelerate is held at 0%; -30 gives 30% progressive braking, then full brake.

zero_snap = 5
; 0 to 25
; Neutral deadzone width in percent. Held input never stops at neutral. A value
; released inside +/-zero_snap becomes 0%, and from 0% the command stays 0%
; until held input carries the value outside the zone. 0 disables it.

both_keys = high_g_only
; high_g_only | neutral
; Accelerate + decelerate together. high_g_only keeps the stored percentage and
; passes W+S to the game (High-G turn). neutral selects 0% at once.
; In toggle mode W+S is always High-G only.

; ---- toggle mode ----

toggle_accelerate = true
; true | false
; true: accelerate toggles +100% on and off. false: vanilla hold input.

toggle_decelerate = false
; true | false
; true: decelerate toggles -100% on and off. false: vanilla hold input.

toggle_after_hold = neutral
; resume | neutral
; After holding a direction whose toggle is false (e.g. a decelerate hold
; during an acceleration toggle): resume returns to the other direction's
; toggle, neutral clears it and returns to 0% on release.

toggle_accelerate_repress = keep
; neutral | keep
; Pressing accelerate again while accelerating. neutral returns to 0% on
; release; keep stays at +100% (leave acceleration with decelerate or
; neutral_key).

[keys]
source = game
; game | custom
; game follows the game's bindings in System.sav and reloads them after the
; game saves new bindings. custom uses the bindings below.

save_path =
; Path to System.sav | empty
; Used with source = game. Empty uses the game's own save under
; %LOCALAPPDATA%\BANDAI NAMCO Entertainment\ACE COMBAT 8\Saved\SaveGames.

accelerate = W
accelerate2 = None
decelerate = S
decelerate2 = None
combined = None
combined2 = None
; Unreal key name | None
; Used only when source = custom. combined is an optional single key that acts
; as accelerate + decelerate together.

[hud]
enabled = true
; true | false
; Independent UMG gauge, visible in first- and third-person views.

x = 0.392
y = 0.50
; 0 to 1 (screen fraction)
; Defaults sit just right of the vanilla speed/throttle scale on a 16:9 HUD.
; x = 0.378 overlaps that scale more closely.

height = 320
; 40 to 1000 (pixels)
; Gauge height.

width = 14
; 2 to 100 (pixels)
; Gauge bar width.

opacity = 1.0
; 0.1 to 1
; Gauge opacity.

font_size = 24
; 8 to 96
; Value text size.
